name: CI

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  id-token: write
  
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.should.outputs.publish }}
      silent: ${{ steps.should.outputs.silent }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check commit message
        id: msg
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "full_message<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Should publish?
        id: should
        env:
          COMMIT_MESSAGE: ${{ steps.msg.outputs.full_message }}
        run: |
          if printf '%s' "$COMMIT_MESSAGE" | grep -qi '\[SILENT\]'; then
            echo "silent=true" >> "$GITHUB_OUTPUT"
          else
            echo "silent=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s' "$COMMIT_MESSAGE" | grep -qi '\[PUBLISH\]'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    if: needs.check.outputs.publish == 'true' && needs.check.outputs.silent != 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit

  snapshot:
    needs: build
    if: needs.check.outputs.publish != 'true' && needs.check.outputs.silent != 'true'
    uses: ./.github/workflows/snapshot.yml
    secrets: inherit
